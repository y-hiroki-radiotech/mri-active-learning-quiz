<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="MRI教材を検索して学べるライブラリ">
  <meta name="theme-color" content="#0b6675">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MRI Learning">
  <title>MRI Learning</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <div><small>MRI EDUCATION PORTAL</small><h1>MRI Learning</h1><p>原理から臨床まで、必要な教材をすぐに見つける。</p></div>
      <label>表示<select id="theme"><option value="system">自動</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    </div>
  </header>
  <main>
    <section class="finder" aria-labelledby="finder-title">
      <div class="finder-title"><div><small>LIBRARY</small><h2 id="finder-title">教材を探す</h2></div><strong id="count" aria-live="polite">読み込み中…</strong></div>
      <label class="search"><span aria-hidden="true">⌕</span><span class="sr-only">教材を検索</span><input id="search" type="search" placeholder="SWAN、磁化率、GRE、頸椎など"></label>
      <div id="filters" class="filters" role="group" aria-label="カテゴリー"></div>
    </section>
    <section aria-label="教材一覧">
      <div id="grid" class="grid" aria-busy="true"></div>
      <div id="empty" class="message" hidden><h2>該当する教材がありません</h2><p>検索語やカテゴリーを変更してください。</p><button id="clear" type="button">絞り込みを解除</button></div>
      <div id="error" class="message error" hidden><h2>教材一覧を読み込めませんでした</h2><button id="retry" type="button">再読み込み</button></div>
    </section>
  </main>
  <footer>MRI Learning — 公開可能な教育コンテンツのみを掲載しています。</footer>
</body>
</html>
